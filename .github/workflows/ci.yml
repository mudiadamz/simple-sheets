# The shared core (simple-core) is private: CI fetches it with the CORE_TOKEN secret (a fine-grained
# token with read access to simple-core's contents), pinned in requirements-core.txt.
# Lint + tests on every push / pull request; builds as downloadable artifacts:
# Windows (app + installer, signed when the SIGN_CERT_* secrets exist), Linux and macOS (app only).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: python -m ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows is the main platform; Linux / macOS runs show what still needs work there
    continue-on-error: ${{ matrix.os != 'windows-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Shared core (private simple-core, CORE_TOKEN secret)
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CORE_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m pip install -r requirements-core.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test (Windows)
        if: runner.os == 'Windows'
        # the GUI tests open real (invisible, off-screen) Tk windows; the Windows runner has a desktop
        run: python -m pytest -q
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb python3-tk
          xvfb-run -a python -m pytest -q
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: python -m pytest -q

  build-windows:
    needs: [lint, test]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      HAS_CERT: ${{ secrets.SIGN_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Shared core (private simple-core, CORE_TOKEN secret)
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CORE_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m pip install -r requirements-core.txt
      - name: Code-signing certificate (optional)
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.SIGN_CERT_BASE64 }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:CERT))
          "SIGN_CERT=$env:RUNNER_TEMP\sign.pfx" >> $env:GITHUB_ENV
      - name: Build app and installer
        shell: cmd
        env:
          SIGN_PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleSheets-windows
          path: |
            dist/SimpleSheets.exe
            dist/SimpleSheets-Setup.exe
          if-no-files-found: error

  build-unix:
    needs: [lint, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Shared core (private simple-core, CORE_TOKEN secret)
        shell: bash
        env:
          CORE_TOKEN: ${{ secrets.CORE_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${CORE_TOKEN}@github.com/".insteadOf "https://github.com/"
          python -m pip install -r requirements-core.txt
      - name: Build
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleSheets-${{ runner.os }}
          path: dist/*
          if-no-files-found: error
